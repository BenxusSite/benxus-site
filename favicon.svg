<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg{fill:#F7F7F4}
    .mk{stroke:#1B2AC8}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0D0D11}
      .mk{stroke:#7E8CFF}
    }
  </style>
  <rect class="bg" width="64" height="64"/>
  <g class="mk" stroke-width="7" stroke-linecap="square">
    <line x1="14" y1="14" x2="50" y2="50"/>
    <line x1="50" y1="14" x2="14" y2="50"/>
  </g>
</svg>
